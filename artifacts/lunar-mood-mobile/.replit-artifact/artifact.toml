kind = "mobile"
previewPath = "/mobile/"
title = "LunarMood Mobile"
version = "1.0.0"
id = "artifacts/lunar-mood-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 21653

[services.development]
run = "pnpm --filter @workspace/lunar-mood-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lunar-mood-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/lunar-mood-mobile", "run", "serve" ]

[services.env]
PORT = "21653"
BASE_PATH = "/mobile/"
