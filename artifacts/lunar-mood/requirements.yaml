packages:
  "framer-motion": "For ethereal page transitions and calendar pop-in animations"
  "date-fns": "For complex calendar grid generation and date formatting"
  "clsx": "Utility for constructing className strings conditionally"
  "tailwind-merge": "Utility to merge tailwind classes without style conflicts"
  "lucide-react": "Beautiful consistent icons"

images:
  - path: "artifacts/lunar-mood/public/images/celestial-bg.png"
    description: "A dark, ethereal abstract background with deep indigo, silver stardust, and soft glowing lunar elements. Minimalist and calming."
